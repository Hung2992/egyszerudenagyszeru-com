    <div id="root">
      <!-- Static shell for instant First Contentful Paint — replaced by React on mount -->
      <style>
         .shell{min-height:100vh;background:#0a0a0a;color:#f2f2f2;font-family:'DM Sans',system-ui,sans-serif;display:flex;flex-direction:column}
        .shell-nav{height:64px;border-bottom:1px solid #292929;display:flex;align-items:center;padding:0 24px}
        .shell-logo{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;letter-spacing:-.02em}
        .shell-hero{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px;text-align:center}
        .shell-pulse{animation:sp .8s ease-in-out infinite alternate}
        @keyframes sp{from{opacity:.4}to{opacity:1}}
      </style>
      <div class="shell">
        <nav class="shell-nav"><span class="shell-logo">egyszerűDenagyszerü</span></nav>
